<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Qu'est-ce qu'on mange ?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On mange ?">
<meta name="theme-color" content="#F2F4EF">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4EF;--card:#FFFFFF;--ink:#1E2A23;--ink-2:#5A665F;--ink-3:#8C968F;--line:#E3E7E0;
    --vert:#2E6A4C;--vert-doux:#E3EEE7;
    --orange:#B65A22;--orange-doux:#FBEFE6;--orange-txt:#8A4116;
    --bleu-doux:#E6EDF7;--bleu-txt:#23406B;
    --r:20px;--nav:68px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .ico.s{width:18px;height:18px}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 0}

  /* en-tête */
  .tete{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
  .tete .txt{flex:1;min-width:0}
  .surtitre{font-size:.86rem;color:var(--ink-2);font-weight:500}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.95rem;line-height:1.08;letter-spacing:-.02em;margin-top:2px}
  h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin:26px 0 10px}
  .etat{font-size:.74rem;color:var(--ink-3);display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:100px;background:var(--card);margin-top:4px;white-space:nowrap;min-height:32px}
  .etat i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
  .etat.ok i{background:var(--vert)}
  .etat.hors i,.etat.jeton i{background:var(--orange)}

  .carte{background:var(--card);border-radius:var(--r);padding:16px}
  .pastille{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:100px;white-space:nowrap}
  .p-tm{background:var(--vert-doux);color:var(--vert)}
  .p-ev{background:var(--bleu-doux);color:var(--bleu-txt);font-weight:500}
  .p-or{background:var(--orange-doux);color:var(--orange-txt)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:600;font-size:.95rem;text-decoration:none}
  .btn-v{background:var(--vert);color:#fff}
  .btn-l{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn-o{background:var(--vert-doux);color:var(--vert)}
  .vide{color:var(--ink-2);font-size:.92rem;padding:6px 2px}

  /* héros */
  .heros{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px}
  .heros .lbl{font-size:.78rem;color:#A9B5AD;font-weight:500;text-transform:uppercase;letter-spacing:.08em}
  .heros h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.55rem;line-height:1.15;margin:8px 0 12px;letter-spacing:-.01em}
  .heros .p-tm{background:#2C3B32;color:#BFE0CC}
  .heros .lancer{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.95rem;color:#D8DFDA}
  .heros .lancer b{color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-size:1.15rem}
  .heros .acts{display:flex;gap:10px}
  .heros .acts .btn-v{flex:1;background:#fff;color:var(--ink);padding:0 12px;white-space:nowrap;font-size:.92rem}
  .heros .rond{width:46px;height:46px;border-radius:14px;background:#2C3B32;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}

  /* listes de recettes */
  .rangee{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .rangee::-webkit-scrollbar{display:none}
  .mini{flex:0 0 72%;max-width:260px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px}
  .mini b{font-weight:600;font-size:.97rem;line-height:1.3;flex:1}
  .mini .pastille{align-self:flex-start}
  .alerte{background:var(--orange-doux);color:var(--orange-txt);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;margin-top:14px}
  .alerte .ico{color:var(--orange);margin-top:1px}
  .alerte b{display:block;color:var(--orange-txt)}
  .alerte p{font-size:.92rem}
  .tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .tuile{background:var(--card);border-radius:var(--r);padding:14px 16px;text-align:left}
  .tuile .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.9rem;line-height:1}
  .tuile .l{font-size:.85rem;color:var(--ink-2);margin-top:6px;display:block}
  .tuile.o .n{color:var(--orange)}

  /* semaine */
  .compteurs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .compteurs div{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center}
  .compteurs b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;line-height:1.1}
  .compteurs span{font-size:.72rem;color:var(--ink-2);line-height:1.2;display:block;margin-top:3px}
  .compteurs .o b{color:var(--orange)}
  .synchro{display:flex;align-items:center;gap:10px;margin:14px 0}
  .synchro .t{flex:1;font-size:.85rem;color:var(--ink-2)}
  .navsem{display:flex;gap:6px}
  .navsem button{width:44px;height:44px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center}
  .jours{display:flex;flex-direction:column;gap:10px}
  .jour{background:var(--card);border-radius:var(--r);padding:14px;display:flex;gap:14px;text-align:left;width:100%}
  .jour.passe{opacity:.55}
  .jour .j{width:42px;flex:none;text-align:center}
  .jour .j span{font-size:.78rem;color:var(--ink-2);text-transform:capitalize;display:block}
  .jour .j b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;line-height:1.1}
  .jour.auj .j b{color:var(--vert)}
  .jour .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .evs{display:flex;flex-wrap:wrap;gap:5px}
  .plat{font-weight:600;font-size:.98rem;line-height:1.3}
  .plat.vide{font-weight:400;color:var(--ink-3)}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.83rem;color:var(--ink-2)}
  .note{font-size:.83rem;color:var(--orange-txt);background:var(--orange-doux);border-radius:10px;padding:5px 9px;align-self:flex-start}
  .barre-btn{display:flex;gap:10px;margin-top:14px}
  .consignes{width:100%;min-height:76px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);outline:none;resize:vertical;line-height:1.4;margin-bottom:10px;display:block}
  .consignes:focus{border-color:var(--vert)}
  .consignes::placeholder{color:var(--ink-3)}
  .adapt{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .adapt .btn{width:100%}
  .sub{border-radius:14px;padding:11px 13px;background:var(--bg);font-size:.9rem;line-height:1.4}
  .sub b{font-weight:600}
  .sub .q{color:var(--ink-2)}
  .sub .att{margin-top:6px;color:var(--orange-txt);background:var(--orange-doux);border-radius:9px;padding:5px 8px;font-size:.84rem}
  .adapt .petit{font-size:.8rem;color:var(--ink-2)}
  .heros .adapt .btn-l{background:#2C3B32;border-color:#3A4B41;color:#fff}
  .heros .sub{background:#2C3B32;color:#fff}
  .heros .sub .q,.heros .adapt .petit{color:#C3CCC6}
  .plat-jour{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .plat-jour>b{display:block;font-weight:600;margin-bottom:10px}
  .gout{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;min-height:50px;margin-bottom:8px}
  .gout span{flex:1;font-size:.95rem}
  .gout button{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .barre-btn .btn{flex:1}

  /* courses */
  .avatars{display:flex;margin-top:6px}
  .avatars span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;border:2px solid var(--bg)}
  .avatars span:first-child{background:var(--vert);color:#fff}
  .avatars span+span{background:#D9C3A5;color:var(--ink);margin-left:-8px}
  .ajout{display:flex;gap:8px;position:relative}
  .ajout input{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);outline:none}
  .ajout input:focus{border-color:var(--vert)}
  .ajout .carre{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .rayon{margin-top:18px}
  .rayon h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0 4px 6px}
  .rayon .carte{padding:4px 0}
  .art{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;width:100%;text-align:left}
  .art+.art{border-top:1px solid var(--line)}
  .art .case{width:24px;height:24px;border-radius:50%;border:1.7px solid #B9C2BC;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
  .art .case .ico{width:14px;height:14px;stroke-width:3;opacity:0}
  .art.fait .case{background:var(--vert);border-color:var(--vert)}
  .art.fait .case .ico{opacity:1}
  .art .nm{flex:1;min-width:0}
  .art.fait .nm{text-decoration:line-through;color:var(--ink-3)}
  .art .org{font-size:.75rem;color:var(--ink-3);white-space:nowrap}
  .lien{font-size:.88rem;color:var(--vert);font-weight:600;padding:12px 4px;min-height:44px}

  /* frigo */
  .bloc{border-radius:var(--r);padding:16px;margin-top:14px}
  .bloc.o{background:var(--orange-doux)}
  .bloc.b{background:var(--card)}
  .bloc h3{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .bloc.o h3{color:var(--orange-txt)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 6px 0 12px;border-radius:100px;font-size:.9rem;font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2)}
  .chip.on{border-color:var(--vert);background:var(--vert-doux);color:var(--vert)}
  .bloc.o .chip{border-color:#EFD4C0}
  .bloc.o .chip.on{border-color:var(--orange);background:#fff;color:var(--orange-txt)}
  .chip .x{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
  .chip .x .ico{width:14px;height:14px}
  .bascule{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-2);margin-top:10px;min-height:44px}
  .bascule input{width:20px;height:20px;accent-color:var(--orange)}
  .ac{position:absolute;left:0;right:56px;top:52px;background:var(--card);border-radius:14px;box-shadow:0 8px 30px rgba(30,42,35,.14);z-index:30;overflow:hidden;display:none}
  .ac.on{display:block}
  .ac button{display:flex;justify-content:space-between;width:100%;padding:12px 14px;text-align:left;min-height:44px}
  .ac button+button{border-top:1px solid var(--line)}
  .ac button span{font-size:.78rem;color:var(--ink-3)}
  .idee{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
  .idee b{font-weight:600;line-height:1.3}
  .idee .u{font-size:.86rem;color:var(--vert)}
  .idee .m{font-size:.86rem;color:var(--ink-2)}
  .idee .acts{display:flex;gap:8px;margin-top:4px}
  .idee .acts .btn{flex:1;min-height:44px}
  .liste{display:flex;flex-direction:column;gap:10px}

  /* barre du bas */
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;color:var(--ink-3);font-size:.72rem;font-weight:500;border-radius:14px}
  nav button.on{color:var(--vert);font-weight:600}
  nav button.on .ico{stroke-width:2}
  .ecran{display:none}
  .ecran.on{display:block}

  /* feuille (choix d'un plat, réglages) */
  .voile{position:fixed;inset:0;background:rgba(30,42,35,.35);z-index:40;display:none}
  .voile.on{display:block}
  .feuille{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--bg);border-radius:24px 24px 0 0;z-index:41;
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  .feuille.on{transform:none}
  .feuille .poignee{width:40px;height:5px;border-radius:3px;background:#C9D0CB;margin:0 auto 12px}
  .feuille h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.25rem;margin-bottom:12px;text-transform:none}
  .feuille .defile{overflow-y:auto;flex:1;margin:10px -16px 0;padding:0 16px}
  .choix{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;min-height:52px;margin-bottom:8px}
  .choix b{flex:1;font-weight:500;font-size:.95rem;line-height:1.3}
  .choix span{font-size:.8rem;color:var(--ink-2);white-space:nowrap}
  .champ{display:block;margin-bottom:12px}
  .champ span{display:block;font-size:.85rem;color:var(--ink-2);margin-bottom:5px}
  .champ input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);outline:none}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:100px;font-size:.9rem;opacity:0;transition:all .2s;pointer-events:none;z-index:50;width:max-content;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-soir" viewBox="0 0 24 24"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 8V6M12 4V3"/></symbol>
  <symbol id="i-sem" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-courses" viewBox="0 0 24 24"><path d="M4 5h2l2 10h10l2-7H7.2"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/></symbol>
  <symbol id="i-frigo" viewBox="0 0 24 24"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 10h13M9 6v1.5M9 13v3"/></symbol>
  <symbol id="i-retour" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-horloge" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3.5 2.8 19.5h18.4zM12 10v4M12 17v.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-micro" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
  <symbol id="i-g" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-d" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-coeur" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></symbol>
  <symbol id="i-chercher" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
</svg>

<!-- ============ ÉCRAN 1 — CE SOIR ============ -->
<section class="ecran" id="e-soir"><div class="wrap">
  <div class="tete"><div class="txt"><div class="surtitre" id="soir-date"></div><h1>Ce soir on mange</h1></div><button class="etat" data-etat></button></div>
  <div id="soir-heros"></div>
  <h2>Pas le temps ? En moins de 20 min</h2>
  <div class="rangee" id="soir-express"></div>
  <div id="soir-demain"></div>
  <div class="tuiles">
    <button class="tuile" data-aller="courses"><span class="n" id="t-courses">0</span><span class="l">articles de courses restants</span></button>
    <button class="tuile o" data-aller="frigo"><span class="n" id="t-frigo">0</span><span class="l">produits à finir vite</span></button>
  </div>
</div></section>

<!-- ============ ÉCRAN 2 — SEMAINE ============ -->
<section class="ecran" id="e-sem"><div class="wrap">
  <div class="tete"><div class="txt"><div class="surtitre" id="sem-dates"></div><h1>La semaine</h1></div><button class="etat" data-etat></button></div>
  <div class="compteurs" id="sem-compteurs"></div>
  <div class="synchro">
    <span class="t" id="sem-synchro"></span>
    <div class="navsem"><button id="sem-prec" aria-label="Semaine précédente"><svg class="ico"><use href="#i-g"/></svg></button><button id="sem-suiv" aria-label="Semaine suivante"><svg class="ico"><use href="#i-d"/></svg></button></div>
  </div>
  <textarea class="consignes" id="sem-consignes" rows="3" aria-label="Consignes pour cette semaine" placeholder="Des consignes pour cette semaine ? ex. pas de poisson, garde mercredi, il reste une demi-butternut"></textarea>
  <button class="lien" id="sem-gouts" style="margin:-6px 0 4px">Nos goûts</button>
  <button class="btn btn-v" id="sem-proposer" style="width:100%;margin-bottom:14px">Proposer la semaine</button>
  <div class="jours" id="sem-jours"></div>
  <div class="barre-btn"><button class="btn btn-o" id="sem-courses"><svg class="ico s"><use href="#i-courses"/></svg>Générer la liste de courses</button></div>
</div></section>

<!-- ============ ÉCRAN 3 — COURSES ============ -->
<section class="ecran" id="e-courses"><div class="wrap">
  <div class="tete"><div class="txt"><h1>Courses</h1><div class="surtitre" id="c-resume" style="text-transform:none;margin-top:4px"></div><div class="avatars"><span>H</span><span>A</span></div></div><button class="etat" data-etat></button></div>
  <div class="ajout">

const STOP=new Set(["de","d","du","des","a","au","aux","la","le","les","en","et"]);
const QUAL=new Set(["fraiche","fraiches","frais","rape","rapee","rapes","liquide","epaisse","entier",
 "demi","ecreme","bio","surgele","surgelee","nature","doux","douce","fine","fines","moulu","moulue",

function norm(s){return (''+s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/œ/g,'oe').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,' ').trim()}
function sing(w){return (w.length>3&&w.endsWith('s'))?w.slice(0,-1):w}
function mots(s){return norm(s).split(' ').filter(w=>w&&!STOP.has(w)).map(sing)}
function variantes(canon){const n=norm(canon);const out=new Set([n]);
 Object.keys(SYN).forEach(k=>{if(norm(k)===n)SYN[k].forEach(v=>out.add(norm(v)))});return [...out]}
function corresp(f,key){
 const F=mots(f);
 for(const v of variantes(key)){
  const V=mots(v);if(!V.length)continue;
  if(V.every(w=>F.includes(w))){const ex=F.filter(w=>!V.includes(w));if(ex.every(w=>QUAL.has(w)))return true}
  if(F.every(w=>V.includes(w))){const ex=V.filter(w=>!F.includes(w));if(ex.every(w=>QUAL.has(w)))return true}
 }
 return false;
}
function trouver(fridge,opts=[],limit=50){
 const res=[];
 for(const p of RECETTES){
  if(opts.length&&!opts.every(o=>p.g.includes(o)))continue;
  const matched=[],missing=[];
  for(const key of p.i){
   const hit=fridge.find(f=>corresp(f,key));
   if(hit)matched.push(hit);else missing.push(key);
  }
  if(fridge.length&&!matched.length)continue;
  const ratio=p.i.length?matched.length/p.i.length:0;
  const score=matched.length*10+ratio*8-missing.length*1.2;
  res.push({r:p,matched:[...new Set(matched)],missing,ratio,score});
 }
 res.sort((a,b)=>b.score-a.score||((typeof FAVS_SET!=='undefined'&&FAVS_SET?FAVS_SET.has(b.r.u)-FAVS_SET.has(a.r.u):0)));
 return res.slice(0,limit);
}

function lireLien(texte){   // lien d'installation « …#cfg=… » -> {url, token}
  const m=(texte||'').trim().match(/#cfg=([^\s#]+)/);if(!m)return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    return o.u&&o.t?{url:o.u,token:o.t}:null}catch(e){return null}
}
(function lienInstallation(){
  if(!/^#cfg=/.test(location.hash))return;
  const c=lireLien(location.hash);
  if(c){CFG=c;save('qm_cfg',CFG);ETAT='hors'}
  history.replaceState(null,'',location.pathname+location.search);
})();

function appliquerLocal(op){
  const l=DATA[LISTE[op.onglet]],k=CLE[op.onglet];
  const i=l.findIndex(x=>String(x[k])===String(op.cle));
  if(op.suppr){if(i>=0)l.splice(i,1);return}
  const ligne=Object.assign({},op.ligne,{[k]:op.cle});
  if(i>=0)l[i]=ligne;else l.push(ligne);
}
function ecrire(ops){
  if(!ops.length)return;
  ops.forEach(appliquerLocal);FILE.push(...ops);
  save('qm_file',FILE);save('qm_data',DATA);rendre();envoyer();
}
async function appel(body){
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:CFG.token},body))});
  const j=await r.json();
  if(!j.ok)throw new Error(j.erreur||'erreur');
  return j;
}
let enCours=false;
async function envoyer(){
  if(!CFG||!CFG.url||enCours)return;
  enCours=true;
  const lot=FILE.slice();
  try{
    const j=await appel(lot.length?{action:'lot',ops:lot}:{action:'lire'});
    FILE=FILE.slice(lot.length);
    DATA={agenda:j.agenda||[],derniere_synchro:j.derniere_synchro||'',menu:j.menu||[],courses:j.courses||[],frigo:j.frigo||[],gouts:j.gouts||[]};
    FILE.forEach(appliquerLocal);           // modifications faites pendant l'envoi
    ETAT='ok';
  }catch(e){ETAT=/jeton/.test(e.message)?'jeton':'hors'}
  enCours=false;
  save('qm_file',FILE);save('qm_data',DATA);rendre();
  if(ETAT==='ok'&&FILE.length)envoyer();
}

const evenementsDu=(agenda,d)=>agenda.filter(e=>e.date<=d&&(e.date_fin||e.date)>=d);
function typeSoir(agenda,d){
  const evs=evenementsDu(agenda,d);
  for(const e of evs){const t=norm(e.titre);
    if(/\b(diner|resto|restaurant|anniversaire)\b/.test(t)&&e.date===d&&(e.debut||'')>='18:00')
      return{type:'dehors',note:'Dîner dehors → rien à prévoir'}}
  for(const e of evs)if(/\bgarde\b/.test(norm(e.titre)))return{type:'garde',note:'Arthur de garde → dîner simple à 3'};
  for(const e of evs){if(estJournee(e)||(e.date_fin||e.date)!==d)continue;
    if(e.fin>='17:00'&&e.fin<='19:30')return{type:'presse',note:'Retour '+hh(e.fin)+' → 20 min max'}}
  return{type:'normal',note:''};
}

}

/* Choisit la meilleure recette pour un soir. ctx = {date, soir:{type,note}, exclus:Set, familles:[], frigo:[], vite:[], favoris:Set} */
function choisirPlat(ctx){
  let cands=DINERS.filter(r=>!ctx.exclus.has(r.u));
  if(ctx.soir.type==='presse')cands=cands.filter(r=>duree(r)&&duree(r)<=25&&!attente(r));
  else if(ctx.soir.type==='garde'){const c=cands.filter(r=>duree(r)&&duree(r)<=45&&!attente(r));if(c.length)cands=c}
  if(!cands.length)return null;
  let meilleur=null;
  for(const r of cands){
    const mV=ctx.vite.filter(f=>r.i.some(k=>corresp(f,k)));
    const mF=ctx.frigo.filter(f=>r.i.some(k=>corresp(f,k)));
    const fav=ctx.favoris.has(r.u),enf=r.g.includes('enfants');
    const usage=ctx.usage||{};
    let s=mV.reduce((t,f)=>t+6/(1+2*(usage[f]||0)),0)+mF.length*1.5+(fav?3:0)+(enf?(ctx.soir.type==='garde'?4:2):0)+(r.g.includes('complet')?1:0)
      -(r.i.length-mF.length)*.3+hachage(ctx.date+r.u)*3.5;
    if(ctx.familles.slice(-2).includes(r.fam))s-=5;
    if(r.fam==='soupe')s-=1.5;
    if(ctx.soir.type==='normal'&&duree(r)>90)s-=4;
    if(!meilleur||s>meilleur.s)meilleur={r,s,mV:mV.filter(f=>!usage[f]),fav,enf};
  }
  const m=meilleur;
  let note=ctx.soir.note;
  if(!note)note=m.mV.length?'Utilise '+m.mV[0]+' à finir vite':m.fav?'Un de vos favoris':m.enf?'Doux pour les enfants':'Pour varier : '+LIB_FAM[m.r.fam];
  return{r:m.r,note};
}
function recettesRecentes(autour,sauf){
  const a=plusJours(autour,-14),b=plusJours(autour,14);
  return new Set(DATA.menu.filter(m=>m.date>=a&&m.date<=b&&!(sauf&&sauf.has(m.date))).map(m=>m.id_recette).filter(Boolean));
}

   Entrée : {jours:[dates ISO], agenda, menu, frigo:[noms], vite:[noms], favoris:Set}
   Sortie : [{date, id_recette, titre, statut:'type|explication'}] */
function proposerSemaine({jours,agenda,menu,frigo,vite,favoris}){
  const sauf=new Set(jours);
  const exclus=new Set(menu.filter(m=>!sauf.has(m.date)&&m.date>=plusJours(jours[0],-14)&&m.date<=plusJours(jours[jours.length-1],14))
    .map(m=>m.id_recette).filter(Boolean));
  const familles=[],sortie=[],usage={};
  for(const d of jours){
    const soir=typeSoir(agenda,d);
    if(soir.type==='dehors'){sortie.push({date:d,id_recette:'',titre:'',statut:'dehors|'+soir.note});continue}
    const c=choisirPlat({date:d,soir,exclus,familles,frigo,vite,favoris,usage});
    if(!c){sortie.push({date:d,id_recette:'',titre:'',statut:soir.type+'|Aucune recette compatible'});continue}
    exclus.add(c.r.u);familles.push(c.r.fam);
    vite.filter(f=>c.r.i.some(k=>corresp(f,k))).forEach(f=>{usage[f]=(usage[f]||0)+1});
    sortie.push({date:d,id_recette:c.r.u,titre:c.r.t,statut:soir.type+'|'+c.note});
  }
  return sortie;
}

/* « Proposer la semaine » par Claude (Apps Script → API Anthropic, cf. apps-script/IA.gs).
   Claude ne choisit que dans DINERS ; tout id inconnu, déjà servi ou incompatible est remplacé
   par l'algorithme local. En cas d'échec (hors ligne, clé absente…) → proposerSemaine() seul. */
async function proposerSemaineIA(p){
  if(!CFG||!CFG.url)throw new Error('pas de service configuré');
  const sauf=new Set(p.jours);
  const exclus=new Set(p.menu.filter(m=>!sauf.has(m.date)&&m.date>=plusJours(p.jours[0],-14)&&m.date<=plusJours(p.jours[p.jours.length-1],14))
    .map(m=>m.id_recette).filter(Boolean));
  const soirs=p.jours.map(d=>({date:d,jour:JOURS_L[deIso(d).getDay()],type:typeSoir(p.agenda,d).type,
    evenements:evenementsDu(p.agenda,d).map(e=>(e.debut?hh(e.debut)+' ':'')+e.titre).join(' ; ')}));
  const catalogue=DINERS.filter(r=>!exclus.has(r.u)).map(r=>[r.u,r.t,duree(r)||'?',attente(r)?'oui':'non',r.g.join(','),r.i.slice(0,6).join(',')]);
  const j=await appel({action:'menu_ia',donnees:{soirs,frigo:p.frigo,vite:p.vite,
    favoris:[...p.favoris].map(u=>PAR_ID[u]&&PAR_ID[u].t).filter(Boolean),
    recents:[...exclus].map(u=>PAR_ID[u]&&PAR_ID[u].t).filter(Boolean),
    consignes:p.consignes||'',gouts:p.gouts||[],catalogue}});
  const parDate={};(j.jours||[]).forEach(x=>{if(x&&x.date)parDate[x.date]=x});
  const local=proposerSemaine(p),pris=new Set();
  return local.map(l=>{
    const x=parDate[l.date],r=x&&PAR_ID[x.id],soir=typeSoir(p.agenda,l.date);
    const ok=r&&soir.type!=='dehors'&&DINERS.includes(r)&&!exclus.has(r.u)&&!pris.has(r.u)
      &&!(soir.type==='presse'&&(attente(r)||(duree(r)||99)>25));
    if(!ok){if(l.id_recette)pris.add(l.id_recette);return l}
    pris.add(r.u);
    return{date:l.date,id_recette:r.u,titre:r.t,statut:soir.type+'|'+(soir.type==='normal'?'✨ '+String(x.raison||'').slice(0,80):soir.note)};
  });
}

/* ================= ÉCRAN 2 — SEMAINE ================= */
let DECALAGE=new Date().getDay()===0?1:0; // semaines (le dimanche, on prépare déjà la suivante)
function lundiDe(s){const d=deIso(s);const j=(d.getDay()+6)%7;d.setDate(d.getDate()-j);return iso(d)}
function joursSemaine(){const l=plusJours(lundiDe(AUJ()),7*DECALAGE);return [0,1,2,3,4,5,6].map(i=>plusJours(l,i))}
function ilYa(s){
  if(!s)return'TimeTree pas encore synchronisé';
  const t=new Date(s);if(isNaN(t))return'TimeTree synchronisé le '+s;
  const h=Math.round((Date.now()-t)/36e5);
  return'TimeTree synchronisé '+(h<1?'il y a moins d\'une heure':h<48?'il y a '+h+' h':'il y a '+Math.round(h/24)+' jours');
}

      '<div class="c">'+(evs?'<div class="evs">'+evs+'</div>':'')+corps+(note?'<span class="note">'+esc(note)+'</span>':'')+'</div></button>';

/* ---------- adapter une recette avec Claude (Apps Script → adapter_ia) ----------
   Substitutions à l'identique uniquement : la recette Cookidoo et ses réglages restent la référence. */
const ADAPT={};   // id recette -> {etat:'charge'|'ok'|'erreur', res, msg} (mémoire de la session)
function zoneAdapter(box,r){
  const a=ADAPT[r.u];
  let h='';
  if(!a||a.etat==='erreur')h='<button class="btn btn-l" data-adapt>'+ico('retour','s')+'Adapter avec Claude</button>'+
    (a?'<span class="petit">Claude indisponible ('+esc(a.msg)+')</span>':'');
  else if(a.etat==='charge')h='<button class="btn btn-l" disabled>Claude regarde la recette…</button>';
  else{
    const subs=a.res.substitutions||[],manq=a.res.manquants||[];
    h=(subs.length?subs.map(x=>'<div class="sub"><b>'+esc(x.remplacer)+' → '+esc(x.par)+'</b>'+(x.quantite?' <span class="q">('+esc(x.quantite)+')</span>':'')+
        (x.pourquoi?'<div class="q">'+esc(x.pourquoi)+'</div>':'')+(x.attention?'<div class="att">'+esc(x.attention)+'</div>':'')+'</div>').join(''):
        '<div class="sub">Rien à changer : la recette Cookidoo s\'applique telle quelle.</div>')+
      (manq.length?'<div class="sub"><b>Encore manquant :</b> '+esc(manq.join(', '))+'</div>'+
        '<button class="btn btn-o" data-manq>'+ico('courses','s')+'Ajouter les manquants aux courses</button>':'')+
      '<span class="petit">Temps, température et vitesse : suivez la recette Cookidoo.'+(a.res.source==='catalogue'?' (Quantités Cookidoo non lues : ingrédients principaux seulement.)':'')+'</span>';
  }
  box.innerHTML='<div class="adapt">'+h+'</div>';
  const b=box.querySelector('[data-adapt]');
  if(b)b.onclick=()=>adapter(box,r);
  const bm=box.querySelector('[data-manq]');
  if(bm)bm.onclick=()=>{const n=ajouterCourses((a.res.manquants||[]).map(k=>({nom:k,origine:'adapté'})));
    toast(n?n+' article'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' aux courses':'Déjà dans la liste')};
}
async function adapter(box,r){
  if(!CFG||!CFG.url){toast('Configurez d\'abord le partage (pastille en haut)');return}
  ADAPT[r.u]={etat:'charge'};zoneAdapter(box,r);
  try{
    const j=await appel({action:'adapter_ia',donnees:{id:r.u,titre:r.t,ingredients:r.i,frigo:frigoNoms(),vite:viteNoms(),gouts:goutsPhrases()}});
    ADAPT[r.u]={etat:'ok',res:j};
  }catch(e){ADAPT[r.u]={etat:'erreur',msg:e.message}}
  if(box.isConnected)zoneAdapter(box,r);else rendre();
}

/* ---------- feuille : réglages (code famille) ---------- */
function ouvrirReglages(){
  ouvrirFeuille('<h3>Partage entre nos téléphones</h3>'+
    '<label class="champ"><span>Le plus simple : collez ici le lien d\'installation reçu</span><input id="rg-lien" autocomplete="off" placeholder="https://…#cfg=…"></label>'+
    '<p class="vide" style="margin-bottom:12px">Ou remplissez les deux champs :</p>'+
    '<label class="champ"><span>Code famille</span><input id="rg-t" type="password" autocomplete="off" value="'+esc(CFG&&CFG.token||'')+'"></label>'+
    '<label class="champ"><span>Adresse du service (Apps Script, se termine par /exec)</span><input id="rg-u" autocomplete="off" value="'+esc(CFG&&CFG.url||'')+'"></label>'+
    '<button class="btn btn-v" id="rg-ok">Enregistrer</button>'+
    (CFG?'<button class="lien" id="rg-off" style="margin-top:6px">Utiliser seulement sur ce téléphone</button>':''));
  $('rg-lien').oninput=()=>{const c=lireLien($('rg-lien').value);
    if(c){$('rg-t').value=c.token;$('rg-u').value=c.url;$('rg-ok').click()}};
  $('rg-ok').onclick=()=>{
    const t=$('rg-t').value.trim(),u=$('rg-u').value.trim();
    if(!t||!/^https:\/\/script\.google\.com\//.test(u)){toast('Code ou adresse incomplets');return}
    CFG={url:u,token:t};save('qm_cfg',CFG);ETAT='hors';fermerFeuille();envoyer();
  };
  if(CFG)$('rg-off').onclick=()=>{CFG=null;save('qm_cfg',null);ETAT='local';fermerFeuille();rendre()};
}

/* ================= ÉCRAN 3 — COURSES ================= */
const RAYONS=CATALOGUE.map(c=>c.c).concat(['Autres']);
function rendreCourses(){
  const rest=coursesRestantes().length;
  $('c-resume').textContent=rest+' article'+(rest>1?'s':'')+' restant'+(rest>1?'s':'')+(CFG?' · partagée':'');
  const grp={};
  DATA.courses.forEach(c=>{const ry=RAYONS.includes(c.rayon)?c.rayon:rayonDe(c.article).c;(grp[ry]=grp[ry]||[]).push(c)});
  $('c-liste').innerHTML=DATA.courses.length?RAYONS.filter(ry=>grp[ry]).map(ry=>{
    const l=grp[ry].sort((a,b)=>(a.coche==='1')-(b.coche==='1')||a.article.localeCompare(b.article,'fr'));
    return'<div class="rayon"><h4>'+ry+'</h4><div class="carte">'+l.map(c=>
      '<button class="art'+(c.coche==='1'?' fait':'')+'" data-a="'+esc(c.article)+'"><span class="case">'+ico('check')+'</span>'+
      '<span class="nm">'+esc(c.article)+'</span><span class="org">'+esc(c.origine||'')+'</span></button>').join('')+'</div></div>';
  }).join(''):'<p class="vide" style="margin-top:18px">La liste est vide.</p>';
  $('c-liste').querySelectorAll('.art').forEach(b=>b.onclick=()=>{
    const c=DATA.courses.find(x=>x.article===b.dataset.a);if(!c)return;
    ecrire([{onglet:'Courses',cle:c.article,ligne:Object.assign({},c,{coche:c.coche==='1'?'':'1'})}]);
  });
  $('c-vider').style.display=DATA.courses.some(c=>c.coche==='1')?'block':'none';
}
function ajoutManuel(){const v=$('c-inp').value.trim().replace(/\s+/g,' ');if(!v)return;
  $('c-inp').value='';if(!ajouterCourses([{nom:v,origine:''}]))toast('Déjà dans la liste')}
$('c-ajout').onclick=ajoutManuel;
$('c-inp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ajoutManuel()}});
$('c-vider').onclick=()=>ecrire(DATA.courses.filter(c=>c.coche==='1').map(c=>({onglet:'Courses',cle:c.article,suppr:true})));
(function dictee(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const b=$('c-micro');b.style.display='flex';
  b.onclick=()=>{const rec=new SR();rec.lang='fr-FR';rec.interimResults=false;
    rec.onresult=e=>{const t=e.results[0][0].transcript.trim();
      const items=t.split(/\s*(?:,| et )\s*/).filter(Boolean).map(x=>({nom:x.replace(/^./,c=>c.toLowerCase()),origine:''}));
      const n=ajouterCourses(items);toast(n?'Ajouté : '+t:'Déjà dans la liste')};
    rec.onerror=()=>toast('Dictée indisponible');rec.start();toast('Je vous écoute…')};
})();

/* ================= ÉCRAN 4 — FRIGO ================= */
let EXCLUS_IDEES=new Set(load('qm_exclus',[]));   // pastilles décochées (propre à ce téléphone)
const ALLING=[];CATALOGUE.forEach(c=>c.l.forEach(v=>ALLING.push({v,r:c.c})));
function ajouterFrigo(v){
  v=(v||'').trim().replace(/\s+/g,' ');if(!v)return;
  const ex=DATA.frigo.find(f=>norm(f.ingredient)===norm(v));
  const vite=$('f-vite').checked?'1':'';
  if(ex&&ex.a_finir_vite===vite){toast('Déjà dans le frigo');return}
  ecrire([{onglet:'Frigo',cle:ex?ex.ingredient:v,ligne:{a_finir_vite:vite}}]);
}
function rendreFrigo(){
  const pastille=f=>{const on=!EXCLUS_IDEES.has(f.ingredient);
    return'<span class="chip'+(on?' on':'')+'" data-i="'+esc(f.ingredient)+'">'+(on?ico('check','s'):'')+esc(f.ingredient)+
      '<button class="x" aria-label="Retirer">'+ico('x')+'</button></span>'};
  const vite=DATA.frigo.filter(f=>f.a_finir_vite==='1'),reste=DATA.frigo.filter(f=>f.a_finir_vite!=='1');
  $('f-vite-l').innerHTML=vite.map(pastille).join('')||'<span class="vide">Rien d\'urgent.</span>';
  $('f-reste-l').innerHTML=reste.map(pastille).join('')||'<span class="vide">Ajoutez ce qu\'il y a au frigo et dans les placards.</span>';
  document.querySelectorAll('#e-frigo .chip').forEach(c=>{
    const nom=c.dataset.i;
    c.onclick=e=>{
      if(e.target.closest('.x')){ecrire([{onglet:'Frigo',cle:nom,suppr:true}]);return}
      EXCLUS_IDEES.has(nom)?EXCLUS_IDEES.delete(nom):EXCLUS_IDEES.add(nom);save('qm_exclus',[...EXCLUS_IDEES]);rendreFrigo();
    };
  });
  const choisis=DATA.frigo.map(f=>f.ingredient).filter(n=>!EXCLUS_IDEES.has(n));
  $('f-titre-idees').textContent='Idées Cookidoo avec '+choisis.length+' ingrédient'+(choisis.length>1?'s':'');
  if(!choisis.length){$('f-idees').innerHTML='<p class="vide">Cochez au moins un ingrédient.</p>';return}
  const res=trouver(choisis,[],120).filter(x=>x.r.cat!=='Desserts'&&x.r.cat!=='Bases').slice(0,10);
  $('f-idees').innerHTML=res.map(x=>{const r=x.r;
    return'<div class="idee"><b>'+esc(r.t)+'</b><div class="meta"><span class="pastille p-tm">TM7</span>'+txtRecette(r)+'</div>'+
      '<span class="u">Utilise '+esc(x.matched.join(', '))+'</span>'+
      (x.missing.length?'<span class="m">Il manque : '+esc(x.missing.join(', '))+'</span>':'<span class="m">Rien ne manque</span>')+
      '<div class="acts"><a class="btn btn-l" href="'+lienDe(r)+'" target="_blank" rel="noopener">'+ico('ext','s')+'Cookidoo</a>'+
      '<button class="btn btn-v" data-u="'+r.u+'">Au menu</button></div></div>'}).join('')||'<p class="vide">Aucune recette du catalogue avec ces ingrédients.</p>';
  $('f-idees').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    let d=AUJ();
    for(let i=0;i<30;i++){const m=menuDu(d);if(!m&&typeSoir(DATA.agenda,d).type!=='dehors')break;d=plusJours(d,1)}
    mettreAuMenu(d,PAR_ID[b.dataset.u],'normal|Avec ce qu\'il reste au frigo');
    const dt=deIso(d);toast('Au menu '+(d===AUJ()?'ce soir':JOURS_L[dt.getDay()]+' '+dt.getDate()));
  });
}
(function autocompletion(){
  const inp=$('f-inp'),box=$('f-ac');let L=[],sel=0;
  const fermer=()=>box.classList.remove('on');
  const valider=v=>{ajouterFrigo(v);inp.value='';fermer()};
  inp.addEventListener('input',()=>{
    const q=norm(inp.value);if(!q){fermer();return}
    L=ALLING.filter(x=>norm(x.v).includes(q)&&!DATA.frigo.some(f=>norm(f.ingredient)===norm(x.v)))
      .sort((a,b)=>norm(a.v).indexOf(q)-norm(b.v).indexOf(q)||a.v.length-b.v.length).slice(0,6);
    if(!L.length){fermer();return}sel=0;
    box.innerHTML=L.map((x,i)=>'<button data-i="'+i+'">'+esc(x.v)+'<span>'+x.r+'</span></button>').join('');
    box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();valider(L[+b.dataset.i].v)});
    box.classList.add('on');
  });
  inp.addEventListener('blur',()=>setTimeout(fermer,150));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();valider(box.classList.contains('on')&&L[sel]?L[sel].v:inp.value)}});
  $('f-ajout').onclick=()=>valider(inp.value);
})();

/* ================= DÉMARRAGE ================= */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
aller(['soir','sem','courses','frigo'].includes(ONGLET)?ONGLET:'soir');
if(CFG===null&&!load('qm_vu',false)){save('qm_vu',true);ouvrirReglages()}
envoyer();
</script>
